name: Generate client rules

on:
  push:
    branches:
      - main
    paths:
      - rules.list
      - config/policy-map.json
      - scripts/generate_shadowrocket.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-client-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate and validate client rules
        run: python scripts/generate_shadowrocket.py

      - name: Verify generated files
        run: |
          test -s generated/shadowrocket.module
          grep -Fxq '#!name=myrule' generated/shadowrocket.module
          grep -Fxq '[Rule]' generated/shadowrocket.module
          find generated/openclash -type f -name '*.yaml' -size +0c -print -quit | grep -q .
          for file in generated/openclash/*.yaml; do
            grep -Fxq 'payload:' "$file"
          done

      - name: Commit generated files when changed
        run: |
          git add generated/shadowrocket.module
          git add -A generated/openclash
          if git diff --cached --quiet; then
            echo "generated client rules are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update generated client rules"
          git push
